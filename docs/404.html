<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Authenticating Credential... | I WILL WIN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function() {
        var l = window.location;
        var search = l.search || '';
        var hash = l.hash || '';
        var repoName = '/I-WILL-WIN---JU/';

        // If the URL has a verify parameter or ID, preserve it
        var targetUrl = l.protocol + '//' + l.host + repoName + search + hash;
        
        // Store for SPA hydration
        try {
          sessionStorage.setItem('redirect', targetUrl);
        } catch (e) {}

        // Instant redirect to correct GitHub Pages repo base
        window.location.replace(targetUrl);
      })();
    </script>
    <style>
      body {
        background-color: #030712;

        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(245, 158, 11, 0.2);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 24px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: #38bdf8;
        text-decoration: underline;
        margin-top: 16px;
        display: inline-block;
      }
    </style>
  </head>
  <body>

    <script>
      document.getElementById('fallback-link').href = window.location.protocol + '//' + window.location.host + '/I-WILL-WIN---JU/' + window.location.search + window.location.hash;
    </script>
  </body>
</html>
